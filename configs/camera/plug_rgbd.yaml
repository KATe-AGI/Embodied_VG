# Camera intrinsics used by the RGB-D 6D grasp pipeline.
#
# Current camera: Intel RealSense D435IF, serial 261822072212, firmware 5.17.3.10.
# Values were copied from test_data/test_261023/20261023_163823_957_meta.json
# and rounded to 0.1 px. The same intrinsics appear in
# 20261023_164528_559_meta.json and calib_20261023_152905/capture_metadata.json.
# Color and depth-aligned-to-color streams share these intrinsics; distortion
# coefficients are all zero. D2RGB depth images are registered into the RGB
# image plane, so their pixel coordinates match RGB images at 1920 x 1080.

camera_frame: camera_rgb
depth_image: D2RGB
image_width: 1920
image_height: 1080

fx: 1365.9
fy: 1365.6
cx: 976.9
cy: 551.1

# Raw D2RGB uint16 values are millimeters.
depth_scale: 0.001
