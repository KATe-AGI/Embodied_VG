# All physical distances are meters; pixel settings refer to the original RGB.
position_unit: meter
reference:
  groove_plane_normal_offset_m: 0.055  # 参考点沿朝向相机的法线正方向平移，单位为米。
  axis_offset_m: 0.200
  surface_offset_m: 0.020
  head_base_z_offset_m: 0.082
  tail_base_z_offset_m: -0.09
endpoint:
  mask_erosion_px: 2
  target_inset_px: 3
  max_target_retreat_px: 12
  patch_radius_px: 14
  min_valid_points: 40
  min_depth_m: 0.10
  max_depth_m: 1.50
  max_axis_angle_deg: 35
  ransac_threshold_m: 0.003
  min_inlier_ratio: 0.65
  max_fit_rmse_m: 0.0015
  max_validation_rmse_m: 0.002
  accuracy_goal_m: 0.003  # Requires physical validation, not guaranteed by fit RMSE.
